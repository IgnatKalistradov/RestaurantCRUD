services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: restaurant-api
    pull_policy: never
    container_name: api
    ports:
      - "5000:8080"
    volumes:
      - ./backend:/app
    command:
      [
        "dotnet",
        "watch",
        "run",
        "--project",
        "./Restaurant.API/Restaurant.API.csproj",
        "--urls=http://0.0.0.0:8080",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: restaurant-frontend
    pull_policy: never
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]

  db:
    image: postgres:15.3
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: restaurant-blobs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    volumes:
      - restaurant-images:/data
    command: ["server", "/data", "--console-address", ":9001"]

volumes:
  pgdata:
  restaurant-images:
